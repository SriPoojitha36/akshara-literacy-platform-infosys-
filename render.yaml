services:
  - type: web
    name: akshara-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: akshara-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SARVAM_API_KEY
        sync: false
      - key: AKSHARA_ADMIN_EMAIL
        sync: false
      - key: AKSHARA_ADMIN_PASSWORD
        sync: false

databases:
  - name: akshara-db
    plan: free
    databaseName: akshara
    user: akshara_user
